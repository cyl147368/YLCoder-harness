name: 验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 在 ${{ matrix.os }} 上使用 Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21']
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 准备 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 验证模块并打包 CLI
        run: mvn -B verify
      - name: 使用本地模拟厂商验证打包 CLI
        run: python scripts/smoke_cli.py
      - name: 验证打包流式输出和 JSON
        run: python scripts/smoke_streaming.py
      - name: 验证原生 Chat Completions 流式输出和工具完成
        run: python scripts/smoke_native_streaming.py
      - name: 验证配置的 MCP 工具与权限隔离
        run: python scripts/smoke_mcp.py
      - name: 验证低风险审核子 agent 与失败回退
        run: python scripts/smoke_auto_review.py
      - name: 验证终端分区、用量统计和缓存命中率
        run: python scripts/smoke_dashboard.py
      - name: 验证真实 Windows 控制台固定底栏及退出恢复
        run: python scripts/smoke_bottom_status.py
      - name: 验证流式中途暂停时的固定底栏
        run: python scripts/smoke_bottom_status.py --streaming --result target/bottom-status-console-streaming.json
      - name: 验证逐行输出的完整滚动历史和回到最新内容
        run: python scripts/smoke_bottom_status.py --streaming --scrollback --answer-lines 72 --result target/bottom-status-scrollback.json
      - name: 验证打包 CLI 的分词预算
        run: python scripts/smoke_token_budget.py
      - name: 验证打包 CLI 持久化厂商消息回放
        run: python scripts/smoke_message_metadata.py
      - name: 验证打包 CLI 批量读取和修改屏障
        run: python scripts/smoke_parallel_reads.py
      - name: 评测成对本地编程上下文
        run: python scripts/evaluate_coding.py
      - name: 无真实凭据地验证自定义验收报告对照
        run: python scripts/check_custom_validation.py
      - name: 仅 localhost 验证真实评测器预置分支
        run: python scripts/check_seeded_evaluation.py
      - name: 离线验证真实 CLI 首文本计时与反例对照
        run: python scripts/check_latency_measurement.py
      - name: 验证独立微型仓库检查器对照
        run: python scripts/check_repository_fixtures.py
      - name: 验证仓库评测器端点与源码集合边界
        run: python scripts/check_repository_runner.py
      - name: 使用已知 localhost 补丁验证关联文件修复
        run: python scripts/evaluate_repository.py --offline --variants paired --max-iterations 4 --timeout 60
      - name: 评测成对多文件修复与过期编辑恢复
        run: python scripts/evaluate_multifile.py
      - name: 构建便携归档
        run: python scripts/package_distribution.py
      - name: 验证解压后的便携启动器与离线工作流
        run: python scripts/smoke_distribution.py
      - name: 验证外部 ServiceLoader 厂商 SPI
        run: python scripts/smoke_custom_provider.py
      - name: 验证交互多任务检查点与恢复
        run: python scripts/smoke_interactive.py
      - name: 验证真实 Windows 控制台中文输入、工具与审批
        run: python scripts/smoke_console_input.py
      - name: 测量合成上下文保留与分词
        run: java -cp harness-cli/target/harness-cli-0.1.0-SNAPSHOT-all.jar dev.codeharness.cli.bench.ContextBenchmark
      - name: 验证本地分词器上下文保留
        run: java -cp harness-cli/target/harness-cli-0.1.0-SNAPSHOT-all.jar dev.codeharness.cli.bench.ContextBenchmark --token-counter o200k
